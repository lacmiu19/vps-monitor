<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Monitor - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#1e293b;border-radius:12px;padding:2.5rem;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
h1{font-size:1.5rem;text-align:center;margin-bottom:.5rem;color:#f1f5f9}
.sub{text-align:center;color:#64748b;font-size:.875rem;margin-bottom:1.5rem}
input{width:100%;padding:.75rem 1rem;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:1rem;margin-bottom:1rem;outline:none;transition:border .2s}
input:focus{border-color:#3b82f6}
button{width:100%;padding:.75rem;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;transition:background .2s}
button:hover{background:#2563eb}
.err{color:#f87171;font-size:.875rem;text-align:center;margin-bottom:1rem}
</style>
</head>
<body>
<form class="card" method="POST" action="/login">
  <h1>VPS Monitor</h1>
  <p class="sub">请输入密码访问监控面板</p>
  {% if error %}<p class="err">密码错误，请重试</p>{% endif %}
  <input type="password" name="password" placeholder="密码" autofocus required>
  <button type="submit">登录</button>
</form>
</body>
</html>
