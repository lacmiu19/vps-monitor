<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Monitor</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
a{color:var(--blue);text-decoration:none}

/* Layout */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:1.1rem;font-weight:600}
.header .meta{display:flex;gap:1.5rem;align-items:center;font-size:.8rem;color:var(--muted)}
.header .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.container{max-width:1400px;margin:0 auto;padding:1rem}

/* Cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem}
.stat-card .label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem}
.stat-card .value{font-size:1.5rem;font-weight:700}
.stat-card .sub{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.stat-card .bar{height:4px;background:var(--border);border-radius:2px;margin-top:.5rem;overflow:hidden}
.stat-card .bar-fill{height:100%;border-radius:2px;transition:width .5s}

/* Sections */
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;overflow:hidden}
.section-header{padding:.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-header h2{font-size:.95rem;font-weight:600}
.section-header .badge{background:var(--blue);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:600}
.search-box{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.8rem;outline:none;width:200px}
.search-box:focus{border-color:var(--blue)}

/* Tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.5rem 1rem;font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;background:rgba(0,0,0,.15)}
td{padding:.5rem 1rem;border-top:1px solid var(--border);font-size:.8rem;white-space:nowrap}
tr:hover td{background:rgba(59,130,246,.05)}
.ip{font-family:'SF Mono',Consolas,monospace;color:var(--blue);font-weight:500}
.port{font-family:'SF Mono',Consolas,monospace;color:var(--muted)}
.geo-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;background:rgba(59,130,246,.1);color:var(--blue)}
.isp-tag{color:var(--dim);font-size:.75rem}
.hits{font-family:'SF Mono',Consolas,monospace;color:var(--orange);font-weight:500}
.time{color:var(--muted);font-size:.75rem}

/* Pagination */
.pagination{padding:.75rem 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.pagination button{padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem}
.pagination button:hover{background:var(--border)}
.pagination button:disabled{opacity:.3;cursor:not-allowed}

/* Top IPs */
.top-ip-list{padding:.75rem 1.25rem}
.top-ip-item{display:flex;align-items:center;gap:.75rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.top-ip-item:last-child{border-bottom:none}
.top-ip-rank{font-size:.7rem;color:var(--dim);width:20px;text-align:center;font-weight:700}
.top-ip-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.top-ip-bar-fill{height:100%;background:var(--blue);border-radius:3px}

/* Responsive */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .header{padding:.5rem .75rem;flex-wrap:wrap;gap:.5rem}
  .header h1{font-size:1rem}
  .header .meta{gap:.5rem;font-size:.7rem}
  .container{padding:.5rem}
  .section-header{padding:.5rem .75rem;flex-wrap:wrap;gap:.5rem}
  .section-header h2{font-size:.85rem}
  td,th{padding:.4rem .5rem;font-size:.7rem}
  .search-box{width:120px}
  .proc-cmd{max-width:150px}
  .top-ip-item{flex-wrap:wrap;gap:.4rem}
  .top-ip-item .ip{width:auto;font-size:.75rem}
  .top-ip-item .geo-tag{min-width:auto;font-size:.65rem}
  .pagination{flex-wrap:wrap;gap:.5rem;padding:.5rem .75rem}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:.5rem}
  .stat-card{padding:.75rem}
  .stat-card .value{font-size:1.2rem}
  .header .meta{width:100%;justify-content:space-between}
  .proc-bar-wrap{width:40px}
  .proc-cmd{max-width:100px;font-size:.65rem}
  .top-ip-item .ip{font-size:.7rem}
  .top-ip-item .hits{width:40px;font-size:.7rem}
  .top-ip-item .port{font-size:.65rem;width:auto}
}
.empty{padding:2rem;text-align:center;color:var(--dim)}
.tab-btn{padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;font-size:.75rem;margin-left:4px;transition:all .2s}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab-btn:hover{border-color:var(--blue)}
.proc-cell{display:flex;align-items:center;gap:6px;white-space:nowrap}
.proc-bar-wrap{width:60px;flex-shrink:0;height:14px;background:var(--border);border-radius:3px;overflow:hidden}
.proc-bar{display:block;height:100%;border-radius:3px;min-width:2px}
.proc-cmd{font-family:'SF Mono',Consolas,monospace;font-size:.75rem;color:var(--muted);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
  <h1>VPS Monitor</h1>
  <div class="meta">
    <span><span class="dot"></span>运行中</span>
    <span id="uptime"></span>
    <a href="/logout" style="color:var(--dim);font-size:.75rem">退出</a>
  </div>
</div>

<div class="container">
  <!-- System Stats -->
  <div class="stats-grid" id="sysStats">
    <div class="stat-card">
      <div class="label">CPU</div>
      <div class="value" id="cpuVal">-</div>
      <div class="sub" id="cpuSub"></div>
      <div class="bar"><div class="bar-fill" id="cpuBar" style="width:0;background:var(--green)"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">内存</div>
      <div class="value" id="memVal">-</div>
      <div class="sub" id="memSub"></div>
      <div class="bar"><div class="bar-fill" id="memBar" style="width:0;background:var(--blue)"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">磁盘</div>
      <div class="value" id="diskVal">-</div>
      <div class="sub" id="diskSub"></div>
      <div class="bar"><div class="bar-fill" id="diskBar" style="width:0;background:var(--yellow)"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">网络流量</div>
      <div class="value" id="netVal">-</div>
      <div class="sub" id="netSub"></div>
    </div>
    <div class="stat-card">
      <div class="label">当前连接</div>
      <div class="value" id="activeVal">-</div>
      <div class="sub" id="activeSub"></div>
    </div>
    <div class="stat-card">
      <div class="label">历史 IP 总数</div>
      <div class="value" id="uniqueVal">-</div>
      <div class="sub" id="uniqueSub"></div>
    </div>
  </div>

  <!-- Processes -->
  <div class="section">
    <div class="section-header">
      <h2>资源占用排行</h2>
      <div>
        <button class="tab-btn active" id="tabMem" onclick="switchProcTab('mem')">按内存</button>
        <button class="tab-btn" id="tabCpu" onclick="switchProcTab('cpu')">按 CPU</button>
      </div>
    </div>
    <div id="procTable"></div>
  </div>

  <!-- Active Connections -->
  <div class="section">
    <div class="section-header">
      <h2>实时活跃连接</h2>
      <span class="badge" id="activeBadge">0</span>
    </div>
    <div id="activeTable"></div>
  </div>

  <!-- Top IPs -->
  <div class="section">
    <div class="section-header">
      <h2>访问量 TOP 10</h2>
    </div>
    <div class="top-ip-list" id="topIps"></div>
  </div>

  <!-- History -->
  <div class="section">
    <div class="section-header">
      <h2>历史连接记录</h2>
      <input class="search-box" id="histSearch" type="text" placeholder="搜索 IP ...">
    </div>
    <div id="histTable"></div>
    <div class="pagination">
      <span id="histInfo"></span>
      <div>
        <button id="histPrev" onclick="histPage(-1)">&laquo; 上一页</button>
        <button id="histNext" onclick="histPage(1)">下一页 &raquo;</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let historyPage = 1;
let histSearchTimer = null;

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

function fmtUptime(s) {
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  let r = '';
  if (d) r += d + '天';
  if (h) r += h + '小时';
  if (m && !d) r += m + '分钟';
  return r || '刚启动';
}

function barColor(pct) {
  if (pct > 90) return 'var(--red)';
  if (pct > 70) return 'var(--orange)';
  if (pct > 50) return 'var(--yellow)';
  return 'var(--green)';
}

function geoStr(geo) {
  if (!geo || !geo.country) return '';
  let s = geo.country;
  if (geo.city && geo.city !== geo.region) s += ' ' + geo.city;
  else if (geo.region) s += ' ' + geo.region;
  return s;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (r.status === 401) { location.reload(); return null; }
  return r.json();
}

// ── System stats ──
async function loadSystem() {
  const d = await fetchJSON('/api/system');
  if (!d) return;
  $('cpuVal').textContent = d.cpu.percent + '%';
  $('cpuSub').textContent = d.cpu.cores + '核 · 负载 ' + d.cpu.load.map(v=>v.toFixed(1)).join(' / ');
  $('cpuBar').style.width = d.cpu.percent + '%';
  $('cpuBar').style.background = barColor(d.cpu.percent);

  $('memVal').textContent = d.memory.percent + '%';
  $('memSub').textContent = fmtBytes(d.memory.used) + ' / ' + fmtBytes(d.memory.total);
  $('memBar').style.width = d.memory.percent + '%';
  $('memBar').style.background = barColor(d.memory.percent);

  $('diskVal').textContent = d.disk.percent + '%';
  $('diskSub').textContent = fmtBytes(d.disk.used) + ' / ' + fmtBytes(d.disk.total);
  $('diskBar').style.width = d.disk.percent + '%';
  $('diskBar').style.background = barColor(d.disk.percent);

  $('netVal').innerHTML = '&darr; ' + fmtBytes(d.network.rx);
  $('netSub').innerHTML = '&uarr; ' + fmtBytes(d.network.tx);
  $('uptime').textContent = '已运行 ' + fmtUptime(d.uptime);
}

// ── Active connections ──
async function loadActive() {
  const data = await fetchJSON('/api/connections');
  if (!data) return;
  $('activeBadge').textContent = data.length;
  $('activeVal').textContent = data.length;

  if (!data.length) {
    $('activeTable').innerHTML = '<div class="empty">暂无活跃连接</div>';
    return;
  }
  let html = '<div class="table-wrap"><table><thead><tr><th>远程 IP</th><th>远程端口</th><th>本地端口</th><th>位置</th><th>ISP</th></tr></thead><tbody>';
  data.forEach(c => {
    const geo = geoStr(c.geo);
    html += `<tr>
      <td class="ip">${c.remote_ip}</td>
      <td class="port">${c.remote_port}</td>
      <td class="port">${c.local_port}</td>
      <td>${geo ? '<span class="geo-tag">'+geo+'</span>' : '-'}</td>
      <td class="isp-tag">${c.geo?.isp || '-'}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  $('activeTable').innerHTML = html;
}

// ── Stats ──
async function loadStats() {
  const d = await fetchJSON('/api/stats');
  if (!d) return;
  $('uniqueVal').textContent = d.unique_ips;
  $('uniqueSub').textContent = '今日 ' + d.today_ips + ' 个新 IP';
  $('activeSub').textContent = '记录总数 ' + d.total_records;

  // Top IPs
  if (!d.top_ips.length) {
    $('topIps').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  const maxHits = d.top_ips[0]?.hits || 1;
  let html = '';
  d.top_ips.forEach((item, i) => {
    const geo = geoStr(item.geo);
    const pct = (item.hits / maxHits * 100).toFixed(0);
    html += `<div class="top-ip-item">
      <span class="top-ip-rank">${i+1}</span>
      <span class="ip" style="width:140px">${item.ip}</span>
      <span class="geo-tag" style="min-width:80px">${geo || '未知'}</span>
      <div class="top-ip-bar"><div class="top-ip-bar-fill" style="width:${pct}%"></div></div>
      <span class="hits" style="width:60px;text-align:right">${item.hits}</span>
      <span class="port" style="width:50px;text-align:right">${item.ports}端口</span>
    </div>`;
  });
  $('topIps').innerHTML = html;
}

// ── History ──
async function loadHistory() {
  const search = $('histSearch').value.trim();
  const d = await fetchJSON(`/api/history?page=${historyPage}&per_page=50&search=${encodeURIComponent(search)}`);
  if (!d) return;

  const totalPages = Math.ceil(d.total / d.per_page) || 1;
  $('histInfo').textContent = `共 ${d.total} 条 · 第 ${d.page}/${totalPages} 页`;
  $('histPrev').disabled = d.page <= 1;
  $('histNext').disabled = d.page >= totalPages;

  if (!d.data.length) {
    $('histTable').innerHTML = '<div class="empty">暂无历史记录</div>';
    return;
  }
  let html = '<div class="table-wrap"><table><thead><tr><th>远程 IP</th><th>本地端口</th><th>首次连接</th><th>最后连接</th><th>连接次数</th><th>位置</th><th>ISP</th></tr></thead><tbody>';
  d.data.forEach(r => {
    const geo = geoStr(r.geo);
    html += `<tr>
      <td class="ip">${r.remote_ip}</td>
      <td class="port">${r.local_port}</td>
      <td class="time">${r.first_seen}</td>
      <td class="time">${r.last_seen}</td>
      <td class="hits">${r.hit_count}</td>
      <td>${geo ? '<span class="geo-tag">'+geo+'</span>' : '-'}</td>
      <td class="isp-tag">${r.geo?.isp || '-'}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  $('histTable').innerHTML = html;
}

function histPage(delta) {
  historyPage = Math.max(1, historyPage + delta);
  loadHistory();
}

// ── Search debounce ──
$('histSearch').addEventListener('input', () => {
  clearTimeout(histSearchTimer);
  histSearchTimer = setTimeout(() => { historyPage = 1; loadHistory(); }, 400);
});

// ── Processes ──
let procSort = 'mem';

function switchProcTab(sort) {
  procSort = sort;
  $('tabMem').className = sort === 'mem' ? 'tab-btn active' : 'tab-btn';
  $('tabCpu').className = sort === 'cpu' ? 'tab-btn active' : 'tab-btn';
  loadProcesses();
}

async function loadProcesses() {
  const data = await fetchJSON(`/api/processes?sort=${procSort}`);
  if (!data) return;
  if (!data.length) {
    $('procTable').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  const isCpu = procSort === 'cpu';
  const maxVal = Math.max(...data.map(p => isCpu ? p.cpu : p.mem), 0.1);
  let html = '<div class="table-wrap"><table><thead><tr><th>PID</th><th>用户</th><th>CPU%</th><th>内存%</th><th>内存占用</th><th style="width:40%">进程</th></tr></thead><tbody>';
  data.forEach(p => {
    const val = isCpu ? p.cpu : p.mem;
    const pct = Math.min(100, val / maxVal * 100);
    html += `<tr>
      <td class="port">${p.pid}</td>
      <td>${p.user}</td>
      <td><div class="proc-cell"><div class="proc-bar-wrap"><span class="proc-bar" style="width:${isCpu ? pct : Math.min(100,p.cpu/maxVal*100)}%;background:var(--orange)"></span></div>${p.cpu}%</div></td>
      <td><div class="proc-cell"><div class="proc-bar-wrap"><span class="proc-bar" style="width:${isCpu ? Math.min(100,p.mem/maxVal*100) : pct}%;background:var(--blue)"></span></div>${p.mem}%</div></td>
      <td class="port">${fmtBytes(p.rss)}</td>
      <td class="proc-cmd" title="${p.command}">${p.command}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  $('procTable').innerHTML = html;
}

// ── Init & refresh ──
async function refresh() {
  await Promise.all([loadSystem(), loadActive(), loadStats(), loadHistory(), loadProcesses()]);
}
refresh();
setInterval(() => { loadSystem(); loadActive(); loadProcesses(); }, 10000);
setInterval(() => { loadStats(); loadHistory(); }, 30000);
</script>
</body>
</html>
